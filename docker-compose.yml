name: findv4-stack

services:
  findv4:
    # Portainer Stack használatakor cseréld ki a felh.nevet a GitHub fiókodra:
    # Cseréld ki pl.: ghcr.io/fekeandras/find:latest
    image: ghcr.io/YOUR_GITHUB_USERNAME/findv4:latest
    container_name: findv4-app
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
